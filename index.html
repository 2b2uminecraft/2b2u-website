<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2b2u</title>
    <style>
        /* Set background image */
        body { 
            background: #141414; color: #fff; margin: 0; padding: 0; 
            font-family: Arial, sans-serif;
            background-image: url('ss9.jpg'); 
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
        }

        /* Dark overlay for readability */
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(20, 20, 20, 0.8); z-index: -1;
        }

        .wrapper { width: 100%; max-width: 1100px; margin: auto; padding: 0 20px; }
        .tab-content { display: none; }
        #tab-home { display: grid !important; } /* Default visible */
        
        /* Layout Grid */
        .main-grid { display: grid; grid-template-columns: 1.8fr 1fr; gap: 30px; margin-bottom: 30px; }
        
        /* Updates Section */
        .updates-container { 
            background: #2b2b2b; padding: 30px; 
            border-top: 2px solid #4ebd69;
        }
        
        /* ... keep your existing nav/slider styles here ... */
    </style>
</head>
<body>
    <div class="wrapper">
        <div id="tab-home" class="tab-content">
            <div class="main-grid">
                <div class="showcase-slider-container">...</div>

            </div>

            <div class="updates-container">
                <div class="update-date">12 June 2025</div>
                <h3 class="update-title">Update: Phantoms In The End</h3>

            </div>
        </div>
