<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2builders2users - Anarchy Server</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background: #141414; color: #fff; display: flex; flex-direction: column; align-items: center; padding-bottom: 50px; min-height: 100vh; }
        .logo-container { margin: 30px 0 20px 0; text-align: center; }
        .logo-image { max-width: 90px; height: auto; display: block; margin: 0 auto; }
        .wrapper { width: 100%; max-width: 1100px; padding: 0 20px; }
        nav { background-color: #333333; display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .nav-links { display: flex; list-style: none; flex-wrap: wrap; }
        .nav-links li a { display: block; padding: 22px 24px; color: #b3b3b3; text-decoration: none; font-weight: bold; font-size: 14px; transition: all 0.2s; cursor: pointer; }
        .nav-links li a.active, .nav-links li a:hover { color: #ffffff; background-color: #444444; }
        .nav-links li a.active { background-color: #ffffff; color: #333333; }
        .shop-btn { background-color: #729fcf; color: white !important; padding: 22px 45px !important; text-transform: uppercase; text-decoration: none; font-weight: bold; font-size: 14px; }
        .tab-content { display: none; }
        .main-grid { display: grid; grid-template-columns: 1.8fr 1fr; gap: 25px; align-items: start; }
        .showcase-slider-container { position: relative; height: 460px; background-color: #1a1a1a; box-shadow: 0 4px 20px rgba(0,0,0,0.6); overflow: hidden; }
        .showcase-card { width: 100%; height: 100%; background-size: cover; background-position: center; background-color: #1a1a1a; transition: background-image 0.2s; }
        .slider-arrow { position: absolute; top: 50%; transform: translateY(-50%); background-color: rgba(114, 159, 207, 0.7); color: white; border: none; width: 40px; height: 40px; cursor: pointer; z-index: 10; }
        .info-sidebar { background-color: #2b2b2b; padding: 40px 35px; box-shadow: 0 4px 20px rgba(0,0,0,0.6); display: flex; flex-direction: column; text-align: center; min-height: 460px; justify-content: space-between; }
        .sidebar-title { color: #4ebd69; font-size: 16px; font-weight: bold; margin-bottom: 6px; }
        .sidebar-subtitle { color: #ffffff; font-size: 15px; font-weight: bold; text-transform: lowercase; margin-bottom: 25px; }
        .player-counter { font-size: 18px; font-weight: bold; color: #ffffff; margin-bottom: 12px; }
        .player-counter span { color: #4ebd69; }
        .ip-connect-btn { background: transparent; border: 1px solid #4ebd69; color: #4ebd69; width: 100%; padding: 15px; font-size: 15px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-bottom: 10px; }
        .content-panel { background-color: #2b2b2b; padding: 50px 60px; max-width: 900px; margin: 0 auto; width: 100%; }
        .panel-title { font-size: 32px; font-weight: bold; text-align: center; margin-bottom: 25px; color: #ffffff; }
    </style>
</head>
<body>

    <div class="logo-container"><img src="logo.jpg" alt="2b2u" class="logo-image"></div>

    <div class="wrapper">
        <nav>
            <ul class="nav-links">
                <li><a onclick="switchTab('home')" id="nav-home" class="active">Home</a></li>
                <li><a onclick="switchTab('modifications')" id="nav-modifications">Modifications</a></li>
                <li><a href="https://reddit.com/r/2b2u" target="_blank">Reddit</a></li>
            </ul>
            <a href="#" class="shop-btn">Shop</a>
        </nav>

        <div id="tab-home" class="tab-content main-grid" style="display: grid;">
            <div class="showcase-slider-container">
                <button class="slider-arrow" style="left:15px;" onclick="changeSlide(-1)">&lsaquo;</button>
                <div class="showcase-card" id="background-slider"></div>
                <button class="slider-arrow" style="right:15px;" onclick="changeSlide(1)">&rsaquo;</button>
            </div>

            <div class="info-sidebar">
                <div>
                    <div class="sidebar-title">2builders2users</div>
                    <div class="sidebar-subtitle">cracked anarchy server</div>
                </div>
                <div>
                    <div class="player-counter">
                        <span id="player-count">Loading...</span> Playing Now
                    </div>
                    <button class="ip-connect-btn" onclick="navigator.clipboard.writeText('2b2u.net')">2B2U.NET</button>
                    <div style="font-size: 12px; color: #8c8c8c;">Click to Copy IP</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function fetchServerStatus() {
            const countDisplay = document.getElementById('player-count');
            // Primary API
            try {
                const response = await fetch('https://api.mcsrvstat.us/3/2b2u.net');
                const data = await response.json();
                if (data.online && data.players) {
                    countDisplay.innerText = data.players.online;
                    return;
                }
            } catch (e) { console.log("Primary API failed"); }

            // Secondary Fallback API
            try {
                const response = await fetch('https://api.minetools.eu/ping/2b2u.net');
                const data = await response.json();
                if (data.players) {
                    countDisplay.innerText = data.players.online;
                    return;
                }
            } catch (e) { console.log("Secondary API failed"); }
            
            countDisplay.innerText = "Offline";
        }

        const slideImages = ['ss1.jpg', 'ss2.jpg', 'ss3.jpg', 'ss4.jpg', 'ss5.jpg'];
        let currentSlideIndex = 0;
        function updateSlider() { document.getElementById('background-slider').style.backgroundImage = `url('${slideImages[currentSlideIndex]}')`; }
        function changeSlide(dir) { currentSlideIndex = (currentSlideIndex + dir + slideImages.length) % slideImages.length; updateSlider(); }
        
        document.addEventListener("DOMContentLoaded", () => {
            updateSlider();
            fetchServerStatus();
            setInterval(fetchServerStatus, 15000);
        });
    </script>
</body>
</html>
