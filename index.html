<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2b2u - Anarchy Server</title>
    <style>
        body { background-color: #1a1a1a; color: #fff; font-family: sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; }
        .header { text-align: center; margin-bottom: 20px; }
        .nav { background: #333; padding: 15px; display: flex; gap: 20px; margin-bottom: 20px; }
        .main-content { display: flex; gap: 20px; }
        .slider { flex: 2; height: 400px; background: #000; display: flex; align-items: center; justify-content: center; }
        .sidebar { flex: 1; background: #222; padding: 20px; border-radius: 5px; }
        .status { font-weight: bold; color: #4ebd69; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header"><h1>2u</h1></div>
        <div class="nav">
            <a href="#" style="color:white; text-decoration:none;">Home</a>
            <a href="#" style="color:white; text-decoration:none;">Modifications</a>
            <a href="#" style="color:white; text-decoration:none;">Reddit</a>
        </div>
        <div class="main-content">
            <div class="slider" id="slider">Slider Images Loading...</div>
            <div class="sidebar">
                <h3>2builders2users</h3>
                <p>cracked anarchy server</p>
                <div class="status" id="player-count">Checking status...</div>
                <button onclick="navigator.clipboard.writeText('2b2u.net')">2B2U.NET</button>
            </div>
        </div>
    </div>

    <script>
        async function updateStatus() {
            const display = document.getElementById('player-count');
            try {
                // Using a reliable public API for Minecraft server status
                const res = await fetch('https://api.mcsrvstat.us/3/2b2u.net');
                const data = await res.json();
                if(data.online) {
                    display.innerText = data.players.online + " Playing Now";
                } else {
                    display.innerText = "Server Offline";
                }
            } catch (err) {
                display.innerText = "Status Unavailable";
            }
        }
        updateStatus();
        setInterval(updateStatus, 30000);
    </script>
</body>
</html>
